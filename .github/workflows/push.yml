name: test on push

on:
  push:
    paths-ignore:
      - '*.md'
      - 'ChangeLog'
      - 'NEWS'
      - 'README'
      - 'COPYING'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-workflows:
    uses: ./.github/workflows/check-workflows.yml

  unit-test:
    needs: check-workflows
    uses: ./.github/workflows/unit-test.yml

  build:
    needs: check-workflows
    strategy:
      matrix:
        os: ["ubuntu:24.04"]
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}

  build-utf8:
    needs: check-workflows
    strategy:
      matrix:
        os: ["ubuntu:24.04"]
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      configure-args: --enable-utf8

  coverage:
    needs: check-workflows
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/coverage.yml

  run-test-other:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        test_name:
          - "command-line-options"
          - "data-rep"
          - "i18n_sjis"
          - "jp-compat"
          - "run"
          - "syntax"
          - "cobj-idx"
          - "file-lock"
          - "file-lock2"
          - "file-lock3"
          - "file-lock4"
          - "file-lock5"
          - "misc"
        os: ["ubuntu:24.04"]
    uses: ./.github/workflows/test-other.yml
    with:
      test-name: ${{ matrix.test_name }}
      os: ${{ matrix.os }}
  
  run-test-other-utf8:
    needs: build-utf8
    strategy:
      fail-fast: false
      matrix:
        test_name:
          - "command-line-options"
          - "data-rep"
          - "cobol_utf8"
          #- "i18n_utf8"
          - "jp-compat"
          - "run"
          - "syntax"
          - "cobj-idx"
          - "file-lock"
          - "file-lock2"
          - "file-lock3"
          - "file-lock4"
          - "file-lock5"
          #- "misc"
        os: ["ubuntu:24.04"]
    uses: ./.github/workflows/test-other.yml
    with:
      test-name: ${{ matrix.test_name }}
      os: ${{ matrix.os }}
      configure-args: --enable-utf8

  run-test-esql:
    needs: build
    strategy:
      matrix:
        os: ["ubuntu:24.04"]
    uses: ./.github/workflows/test-esql.yml
    with:
      os: ${{ matrix.os }}

  run-test-esql-utf8:
    needs: build-utf8
    strategy:
      matrix:
        os: ["ubuntu:24.04"]
    uses: ./.github/workflows/test-esql-utf8.yml
    with:
      os: ${{ matrix.os }}

  run-test-esql-examples:
    needs: build
    strategy:
      matrix:
        os: ["ubuntu:24.04"]
    uses: ./.github/workflows/test-esql-examples.yml
    with:
      os: ${{ matrix.os }}

  run-test-cobj-api:
    needs: build
    strategy:
      matrix:
        os: ["ubuntu:24.04"]
    uses: ./.github/workflows/test-cobj-api.yml
    with:
      os: ${{ matrix.os }}

  run-test-nist:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        test_name: ["IC", "IF", "IX", "NC", "OB", "RL", "SG", "SM", "SQ", "ST"]
        os: ["ubuntu:24.04"]
    uses: ./.github/workflows/test-nist.yml
    with:
      test-name: ${{ matrix.test_name }}
      check-result: true
      os: ${{ matrix.os }}

  run-test-nist-utf8:
    needs: build-utf8
    strategy:
      fail-fast: false
      matrix:
        test_name: ["IC", "IF", "IX", "NC", "OB", "RL", "SG", "SM", "SQ", "ST"]
        os: ["ubuntu:24.04"]
    uses: ./.github/workflows/test-nist.yml
    with:
      test-name: ${{ matrix.test_name }}
      check-result: true
      os: ${{ matrix.os }}
      configure-args: --enable-utf8

  run-test-nist-extra:
    needs: build
    strategy:
      matrix:
        test_name: ["CM", "DB", "RW"]
        os: ["ubuntu:24.04"]
    uses: ./.github/workflows/test-nist.yml
    with:
      test-name: ${{ matrix.test_name }}
      check-result: false
      os: ${{ matrix.os }}

  build-gcc9:
    needs: check-workflows
    uses: ./.github/workflows/build-gcc9.yml

  javadoc:
    needs: check-workflows
    uses: ./.github/workflows/javadoc.yml

  check-missing-javadoc:
    needs: check-workflows
    uses: ./.github/workflows/check-missing-javadoc.yml

  windows-build:
    needs: check-workflows
    uses: ./.github/workflows/windows-build.yml
    with:
      upload-artifacts: true

  windows-test:
    needs: windows-build
    strategy:
       matrix:
         test_name: ["IC", "IF", "IX", "NC", "OB", "RL", "SG", "SM", "SQ", "ST"]
    uses: ./.github/workflows/windows-test.yml
    with:
      test-name: ${{ matrix.test_name }}

  windows-generate-test-scripts:
    needs: check-workflows
    uses: ./.github/workflows/windows-generate-test-scripts.yml

  windows-test-other:
    needs: [windows-build, windows-generate-test-scripts]
    strategy:
      fail-fast: false
      matrix:
        test_name:
          - "command-line-options"
          - "data-rep"
          - "jp-compat"
          - "run"
          - "syntax"
          - "file-lock"
          - "file-lock2"
          - "file-lock3"
          - "file-lock4"
          - "file-lock5"
          - "misc"
    uses: ./.github/workflows/windows-test-other.yml
    with:
      test-name: ${{ matrix.test_name }}

  # TODO: Re-enable when Windows PostgreSQL setup is resolved.
  # The pre-installed PostgreSQL on Windows runners requires initdb
  # in RUNNER_TEMP, but cobj.exe segfaults with the new esql-scanner.
  # windows-test-esql:
  #   needs: [windows-build, windows-generate-test-scripts]
  #   uses: ./.github/workflows/windows-test-esql.yml

  static-analysis:
    needs: check-workflows
    uses: ./.github/workflows/static-analysis.yml

  check-dev-container:
    needs: check-workflows
    uses: ./.github/workflows/check-dev-container.yml
