name: Windows ESQL tests

on:
  workflow_call:
    inputs:
      test-name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    env:
      CLASSPATH: ".;C:/opensourcecobol4j/lib/libcobj.jar"
      PG_LOG: "postgresql.log"

    steps:
    - uses: actions/checkout@v7

    - name: Download test scripts
      uses: actions/download-artifact@v8
      with:
        name: windows-test-scripts
        path: tests/

    - name: Download libcobj.jar
      uses: actions/download-artifact@v8
      with:
        name: libcobj.jar
        path: libcobj/app/build/libs/

    - name: Download cobj.exe
      uses: actions/download-artifact@v8
      with:
        name: cobj.exe
        path: win/x64/Release/

    - name: Install Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install opensource COBOL 4J
      run: |
        cd win
        ./make-install.ps1

    - name: Start PostgreSQL
      shell: pwsh
      run: ./win/start-test-postgresql.ps1 -LogFile "$env:RUNNER_TEMP/$env:PG_LOG"

    - name: Set up test environment
      shell: bash
      run: |
        cd tests
        cp atlocal-win.env atlocal
        WORKSPACE=$(cd .. && pwd)
        sed -i "s|abs_builddir=.*|abs_builddir='${WORKSPACE}/tests'|" atconfig
        sed -i "s|abs_srcdir=.*|abs_srcdir='${WORKSPACE}/tests'|" atconfig
        sed -i "s|abs_top_srcdir=.*|abs_top_srcdir='${WORKSPACE}'|" atconfig
        sed -i "s|abs_top_builddir=.*|abs_top_builddir='${WORKSPACE}'|" atconfig
        sed -i "s|SHELL=.*|SHELL='$(which bash)'|" atconfig

        # ${EMBED_DB_INFO} substitutes these connection settings into every
        # COBOL source before it is compiled.
        cp ../.github/workflows/db-settings/embed_db_info_windows.sh embed_db_info.sh

    - name: Run tests ${{ inputs.test-name }}
      shell: bash
      run: |
        # Create a diff wrapper that strips trailing CR so CRLF output from
        # Windows binaries compares equal to LF expected outputs.
        mkdir -p /tmp/diff-wrapper
        printf '%s\n' '#!/bin/bash' 'exec /usr/bin/diff --strip-trailing-cr "$@"' > /tmp/diff-wrapper/diff
        chmod +x /tmp/diff-wrapper/diff
        export PATH="/tmp/diff-wrapper:$PATH"
        cd tests
        # The groups of a suite share the tables they create, so the suite has
        # to run its groups one at a time.  The suites are separate jobs, and
        # each job gets a cluster of its own, so they do not collide.
        ./${{ inputs.test-name }}

    - name: Show the PostgreSQL log if tests fail
      if: failure()
      shell: pwsh
      run: |
        $log = "$env:RUNNER_TEMP/$env:PG_LOG"
        if (Test-Path $log) { Get-Content $log }

    - name: Upload log files if tests fail
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: windows-${{ inputs.test-name }}-log
        path: tests/${{ inputs.test-name }}.dir/
