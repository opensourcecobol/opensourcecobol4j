# Default SLF4J Simple Logger configuration bundled in libcobj.jar.
#
# libcobj ships slf4j-simple as its runtime logging provider. Without this
# file slf4j-simple defaults to logging at INFO level to stderr, so the ESQL
# runtime (jp.osscons.opensourcecobol.libcobj.sql.*) would print ERROR lines
# to stderr even when a COBOL program is executed with a plain `java` command
# and no extra options.
#
# Turn the ESQL loggers off by default. The setting is scoped to libcobj's own
# logger namespace (jp.osscons.opensourcecobol.libcobj.sql) instead of the
# global defaultLogLevel, so it never silences other slf4j loggers that an
# application using libcobj.jar may have. slf4j-simple resolves a logger's
# level by walking up its dotted name, so this single key covers every logger
# under that namespace (CobolEsql, SqlConnection, ...).
#
# A `-D` system property always takes precedence over this file, so logging can
# still be re-enabled, e.g. (as the test suite does):
#   java -Dorg.slf4j.simpleLogger.log.jp.osscons.opensourcecobol.libcobj.sql.CobolEsql=debug ...
org.slf4j.simpleLogger.log.jp.osscons.opensourcecobol.libcobj.sql=off
